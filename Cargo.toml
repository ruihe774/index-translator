[workspace]
resolver = "3"
members = ["minisilk", "minisilk/wasm", "minicelt", "minicelt/wasm"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

# Release code with debug_assert!s and integer overflow checks, for the compare.ts tests.
[profile.checked]
inherits = "release"
debug-assertions = true
overflow-checks = true
