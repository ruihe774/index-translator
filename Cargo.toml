[package]
name = "minisilk"
version = "0.1.0"
edition = "2024"

[lib]
doctest = false
test = false

[dependencies]
libm = "0.2.16"

[workspace]
members = ["wasm"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

# Release code with debug_assert!s and integer overflow checks, for test/compare.ts.
[profile.checked]
inherits = "release"
debug-assertions = true
overflow-checks = true
