[package]
name = "minisilk"
version = "0.1.0"
edition = "2024"

[lib]
doctest = false

[dependencies]
libm = "0.2.16"

[dev-dependencies]
oracle = { path = "oracle" }

[workspace]
members = ["oracle", "wasm"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[profile.test]
opt-level = 1
