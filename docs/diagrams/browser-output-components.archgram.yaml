archgram: 1
title: Index Translator browser components, output
description: >-
  The page's main module renders a translation as Markdown only when the source looks like it. The
  parser is pure, and the DOM builder never parses a string as HTML. A SubRip text is shown as a
  table of cues by its own builder. After a finished translation the link check disables or flags
  links the source did not have, and the paragraph module counts the paragraphs of both sides. Full
  view shows one side, or both side by side, in a reading column, with the rows of each block given
  by a pure module.
direction: down
legend: true
nodes:
  - { id: app, kind: browser, label: "public/app.ts", note: "wires the page" }
  - { id: markdown, kind: service, label: "public/markdown.ts", note: pure parser }
  - { id: markdown-dom, kind: service, label: "public/markdown-dom.ts", note: "builds DOM, no innerHTML" }
  - { id: subtitle-dom, kind: service, label: "public/subtitle-dom.ts", note: "cue table" }
  - { id: subtitles, kind: service, label: "public/subtitles.ts", note: "SubRip, pure" }
  - { id: links, kind: check, label: "public/links.ts", note: link check }
  - { id: link-dialog, kind: service, label: "public/link-dialog.ts", note: confirms a link }
  - { id: full-view, kind: service, label: "public/full-view.ts", note: "one side or both, alone" }
  - { id: side-by-side, kind: service, label: "public/side-by-side.ts", note: "grid rows per block, pure" }
  - { id: paragraphs, kind: check, label: "public/paragraphs.ts", note: counts paragraphs }
edges:
  - { from: app, to: markdown, label: "looks like Markdown" }
  - { from: app, to: markdown-dom, label: render output }
  - { from: app, to: subtitles, label: "translate cues" }
  - { from: markdown-dom, to: markdown }
  - { from: markdown-dom, to: subtitle-dom, label: "SubRip source" }
  - { from: subtitle-dom, to: subtitles }
  - { from: markdown-dom, to: links }
  - { from: links, to: markdown }
  - { from: links, to: paragraphs }
  - { from: app, to: link-dialog, label: "confirm link" }
  - { from: link-dialog, to: links }
  - { from: app, to: paragraphs }
  - { from: app, to: full-view, label: "enter, leave" }
  - { from: full-view, to: side-by-side, label: block rows }
flows:
  - { name: output, steps: [app, markdown-dom, links, paragraphs] }
  - { name: subtitles, steps: [app, markdown-dom, subtitle-dom, subtitles] }
