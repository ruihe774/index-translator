archgram: 1
title: Index Translator server components, engines
description: >-
  The app builds the chat or document prompt and asks the translation engine for a generation. The
  engine owns a worker thread, which loads the model through the bindings file and calls libllama.
  The chat prompt is written by the bindings, not by the templates. An image is encoded by libmtmd on
  that same thread. The speech engine owns its own worker thread, which calls libaudiocpp through its
  bindings, runs the voice separator on uploaded samples, and reads WAV samples through wav.ts. The
  two engines share nothing but the process.
direction: down
legend: true
frames:
  - { id: translation, label: Translation }
  - { id: reading, label: Reading aloud }
nodes:
  - { id: app, kind: service, label: "src/app.ts", note: "caller, see HTTP diagram" }
  - { id: prompt, kind: service, label: "src/prompt.ts", note: chat and document prompts, frame: translation }
  - { id: prompts, kind: file, label: "prompts/*.txt", note: NativeLong templates, frame: translation }
  - { id: llama, kind: service, label: "src/llama.ts", note: owns the worker, frame: translation }
  - { id: llama-worker, kind: service, label: "src/llama-worker.ts", note: worker thread, frame: translation }
  - { id: llama-ffi, kind: service, label: "src/llama-ffi.ts", note: bindings, frame: translation }
  - { id: shim, kind: generated, label: "src/llama-shim.c", note: builds the shim, frame: translation }
  - { id: libllama, kind: service, label: libllama, note: llama.cpp on Vulkan, variant: external }
  - { id: libmtmd, kind: service, label: libmtmd, note: "image encoder", variant: external }
