  - { id: preflight, kind: check, label: "src/preflight.ts", note: refuses an unusable machine, frame: startup }
  - { id: probe, kind: script, label: "src/llama-probe.ts", note: child process, frame: startup }
  - { id: models, kind: file, label: "src/models.ts", note: the two model specs, frame: startup }
  - { id: app, kind: service, label: "src/app.ts", note: "routes, SSE, resumable jobs", frame: http }
