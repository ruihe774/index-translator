archgram: 1
title: Index Translator server components, startup and HTTP
description: >-
  The entry point loads the configuration and runs the preflight check before it starts the app.
  Preflight probes the llama library in a child process and checks the default model's file. The
  app checks each request's origin and host, serves the web app, puts translations and speech into
  their own lines, and hands the work to the engines. An image is prepared before it takes a place in
  the line, so a bad one never waits. A translation the reader has left keeps running for a while and
  can be read again. The engines are drawn in the next diagram.
direction: right
legend: true
frames:
