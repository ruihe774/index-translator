archgram: 1
title: Index Translator server components, HTTP
description: >-
  The app puts translations and speech
  into their own lines, and hands the work to the engines. An image is prepared before it takes a
  place in the line, so a bad one never waits. Translations and transcriptions run as jobs that keep
  going for a while after the reader has left and can be read again. Speech is answered as WAV or as
  an Ogg Opus stream. Startup is drawn in the previous diagram, the engines in the next ones.
direction: down
legend: true
nodes:
  - { id: engines, kind: service, label: "Engines", note: "llama.ts, speech.ts, segment.ts, webpage.ts: next diagrams", variant: external }
  - { id: client, kind: browser, label: Web app, note: "public/, in the browser" }
  - { id: app, kind: service, label: "src/app.ts", note: "route table, SSE" }
  - { id: image, kind: service, label: "src/image.ts", note: "PNG for the engine" }
  - { id: jobs, kind: service, label: "src/jobs.ts", note: "resumable jobs" }
  - { id: tickets, kind: service, label: "src/tickets.ts", note: "an engine's waiting line" }
  - { id: queue, kind: queue, label: "src/queue.ts", note: "429 when full" }
  - { id: speech-response, kind: service, label: "src/speech-response.ts", note: "WAV or Ogg Opus" }
edges:
  - { from: app, to: engines, label: "generate, synthesize, transcribe, segment, align, fetch" }
  - { from: client, to: app, label: "POST /translate, /speech, ..." }
  - { from: app, to: image, label: prepare image }
  - { from: app, to: jobs, label: "translations, transcriptions" }
  - { from: app, to: tickets, label: "lines: translate, speech, segment" }
  - { from: tickets, to: queue, label: takes a place }
  - { from: jobs, to: queue, label: "job slots" }
  - { from: app, to: speech-response, label: "speech answer" }
flows:
  - { name: a request, steps: [client, app, engines] }
