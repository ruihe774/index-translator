  - { from: app, to: select, label: "select model" }
  - { from: app, to: run, label: "start a run" }
  - { from: run, to: resume, label: "read stream" }
  - { from: resume, to: sse, label: "reads events" }
  - { from: run, to: push, label: "notify when done" }
  - { from: app, to: webpage-flow, label: "a page address" }
  - { from: webpage-flow, to: run }
  - { from: webpage-flow, to: server, label: "POST /webpage" }
flows:
