archgram: 1
title: Index Translator browser components, requests
description: >-
  The page's main module builds the request body, from text or an image and with the glossary, and
  picks the model by the text's length. A run sends it and reads the event stream through the resume
  module, which reconnects after the last event seen when the connection is cut. A web page is
  fetched through the same run before its Markdown is translated. When the server offers Web Push, the
  run subscribes its job (PUT ./push) so a notification arrives if the page is away when it ends.
direction: down
legend: true
frames:
  - { id: requesting, label: Request }
nodes:
  - { id: server, kind: service, label: Server API, note: "/api/v1, see server diagrams", variant: external }
  - { id: app, kind: browser, label: "public/app.ts", note: "wires the page, sends the request" }
  - { id: api, kind: service, label: "public/api.ts", note: "API base, failure text", frame: requesting }
  - { id: errors, kind: check, label: "public/errors.ts", note: server error codes, frame: requesting }
  - { id: request, kind: service, label: "public/request.ts", note: "builds the body, text or image", frame: requesting }
  - { id: run, kind: service, label: "public/run.ts", note: "one run, Stop", frame: requesting }
  - { id: resume, kind: service, label: "public/resume.ts", note: "reconnects after a cut", frame: requesting }
  - { id: glossary, kind: service, label: "public/glossary.ts", note: parses the glossary, frame: requesting }
  - { id: select, kind: service, label: "public/select-model.ts", note: "picks the model by length", frame: requesting }
  - { id: sse, kind: service, label: "public/sse.ts", note: reads the event stream, frame: requesting }
  - { id: push, kind: service, label: "public/push.ts", note: "subscribes the job", frame: requesting }
  - { id: webpage-flow, kind: service, label: "public/webpage-flow.ts", note: "fetches a page, asks first", frame: requesting }
edges:
