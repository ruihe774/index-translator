archgram: 1
title: Index Translator browser components, voices
description: >-
  The voice settings list the voices and remember the chosen one in local storage. A sample is
  recorded by the microphone recorder or picked as a file, then audio-upload mixes it down and
  resamples it and encodes it as Ogg Opus when the server takes that, otherwise as WAV, and the
  voice module sends it to the server.
direction: down
legend: true
frames:
  - { id: voices, label: Voices }
nodes:
  - { id: server, kind: service, label: Server API, note: "/voices, see server diagrams", variant: external }
  - { id: speech-ui, kind: service, label: "public/speech-ui.ts", note: "lists and picks voices" }
  - { id: voice-sample, kind: service, label: "public/voice-sample.ts", note: uploads a sample, frame: voices }
  - { id: mic-recorder, kind: service, label: "public/mic-recorder.ts", note: records a sample, frame: voices }
  - { id: audio-upload, kind: service, label: "public/audio-upload.ts", note: "Ogg Opus or WAV", frame: voices }
  - { id: storage, kind: storage, label: "public/storage.ts", note: "local storage, try and catch" }
edges:
  - { from: speech-ui, to: storage, label: "chosen voice" }
  - { from: speech-ui, to: voice-sample, label: "voice upload" }
  - { from: voice-sample, to: mic-recorder, label: record }
  - { from: voice-sample, to: audio-upload, label: encode }
  - { from: audio-upload, to: mic-recorder, label: "WAV writer" }
  - { from: voice-sample, to: server, label: "POST /voices" }
flows:
  - { name: a voice upload, steps: [speech-ui, voice-sample, audio-upload, mic-recorder] }
