archgram: 1
title: Index Translator architecture
description: >-
  The web app runs in the browser. It picks the model by the text's length and keeps the history,
  any opened PDF and any recording's player there. Its requests go to one Bun process. A translation
  waits in its own line for the llama worker thread, which loads the chat model; the same thread
  translates the text in an image. Reading aloud and transcribing a recording share a second line
  for the speech worker thread, which loads the speech model, the voice separator and the
  transcription models. Sentence ends and paragraph matching go to a third worker on the CPU, and a
  web page is opened in a headless browser. The workers never wait for each other.
direction: right
legend: true
frames:
  - { id: client, label: In the browser }
  - { id: server, label: One Bun process }
nodes:
  - { id: browser, kind: browser, label: Web app, note: "picks model, keeps history", frame: client }
  - { id: api, kind: service, label: HTTP API, note: "/api/v1 and the web app", frame: server }
  - { id: tline, kind: queue, label: Translation line, note: one at a time, frame: server }
  - { id: sline, kind: queue, label: Speech line, note: "one at a time, also transcribing", frame: server }
  - { id: llama, kind: service, label: llama worker, note: libllama on Vulkan, frame: server }
  - { id: speech, kind: service, label: speech worker, note: libaudiocpp, frame: server }
  - { id: segment, kind: service, label: segment worker, note: "libsat and LaBSE on the CPU", frame: server }
  - { id: webpage, kind: service, label: Headless browser, note: "Bun.WebView, Markdown out", frame: server }
  - { id: chat, kind: model, label: Chat model, note: "GGUF, Q6_K, text and images" }
  - { id: tts, kind: model, label: Speech model, note: IndexTTS-2.5 }
  - { id: sep, kind: model, label: Voice separator, note: Mel-Band RoFormer }
  - { id: moss, kind: model, label: Transcription models, note: "MOSS, CED, Silero VAD" }
  - { id: sat, kind: model, label: Sentence models, note: "SaT, LaBSE" }
edges:
  - { from: browser, to: api, label: "translate, speech, segment" }
  - { from: api, to: tline, label: translate }
  - { from: api, to: sline, label: "speech, transcriptions" }
  - { from: api, to: segment, label: "segment, align" }
  - { from: api, to: webpage, label: webpage }
  - { from: tline, to: llama }
  - { from: sline, to: speech }
  - { from: chat, to: llama, label: loads }
  - { from: tts, to: speech, label: loads }
  - { from: sep, to: speech, label: "loads on upload", style: dashed }
  - { from: moss, to: speech, label: "loads to transcribe", style: dashed }
  - { from: sat, to: segment, label: "loads on first use", style: dashed }
flows:
  - { name: a translation, steps: [browser, api, tline, llama] }
  - { name: reading aloud or transcribing, steps: [browser, api, sline, speech] }
  - { name: sentence ends, steps: [browser, api, segment] }
