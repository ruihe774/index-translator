openapi: 3.1.0
info:
  title: Index Translator API
  version: 2.0.0
  summary: Text and image translation backed by locally deployed Index-Translate models.
  description: |
    The backend runs Index-Translate models through llama.cpp and exposes them over REST.
    Two checkpoints are available (see `GET /models`):

    - `index-translate-9b`: general translation in any supported language, with glossary and
      constraint support.
    - `index-nailong-9b`: whole-document translation (NativeLong) in four directions only:
      `zh-en`, `en-zh`, `zh-ja` and `ja-zh`. It takes no glossary or constraints.

    The client chooses the model per request with the `model` field. The backend never picks a
    model for the client.

    **Single-pass translation.** A request is translated in one generation; the backend never
    splits the input. Input size is limited in tokens (see `limits` in `GET /health`), and
    `POST /tokenize` reports how many tokens a request would use before it is sent.

    **Images.** `index-translate-9b` also translates the text in an image: a request carries an
    `image` (JPEG, PNG or WebP, at most 8 MiB and 50 million pixels) in place of `text`. The
    server decodes it and hands it to the model's image encoder, a separate file that is loaded
    with the first image; the answer is the translation of the text the model reads in it, with
    no separate text recognition step. An image costs up to about 4,100 tokens of the input
    limit, depending on its size.

    **Model switching.** The GPU holds one model at a time. A request for a model that is not
    loaded waits in the queue, unloads the current model, loads the requested one (this takes
    a few seconds), and then runs. Consecutive requests for the same model do not reload.

    **Streaming.** `POST /translate` returns either one JSON document or a Server-Sent Events
    stream. The body field `stream` is the only selector: `stream: true` gives SSE, anything else
    gives JSON, and the `Accept` header is not consulted. Because the request needs a body, the
    stream is consumed with `fetch` (or any HTTP client that can read a streamed response), not
    with the browser `EventSource` API.

    **Concurrency.** One request at a time uses the engine. Further requests wait in a bounded
    FIFO queue; when it is full the backend answers `429`. Closing the connection cancels a
    waiting or running translation, except for a streamed request with `resumable: true`,
    which keeps running for a while without a reader (see `GET /translations/{id}/events`).

    **Reading aloud.** `POST /speech` turns one short text into speech with IndexTTS-2.5, which
    runs with its own engine (audio.cpp) beside the translation model. It speaks
    Chinese, English, Japanese, Spanish and Arabic. The model has no built-in voices: a voice is
    a reference recording on the server (`GET /voices`) that the model imitates. One request is
    one utterance, returned whole; a client reads a document by sending it sentence by sentence.
    The speech model is loaded by the first request, which therefore takes a few seconds longer,
    and is unloaded again after a while without requests. Speech requests have their own queue of
    the same size. Closing the connection cancels the utterance; what that does depends on how
    far it got, see `POST /speech`.

    **Sentence boundaries.** `POST /segment` tells where sentences are likely to end in a text,
    with SaT (Segment any Text), a small model that runs on the processor beside the others.
    It answers probabilities, not pieces: the web app combines them with its own length limits to
    cut a document into utterances for `POST /speech`. Like the speech model it is loaded by the
    first request and unloaded after a while without one.

    **Web pages.** `POST /webpage` opens a web page in a headless browser on the server and
    answers its content as Markdown, for a client to translate as a text. It is off unless the
    server lists the domains it may open (`ALLOWED_WEBPAGE_DOMAINS`).

    **Errors.** Every error response has the same JSON envelope, see `Error`. Any `/api/v1`
    path called with a method it does not have answers `405` (`method_not_allowed`, with an
    `Allow` header), and an unknown path `404` (`not_found`). Every operation can also answer
    `500` (`internal_error`).
servers:
  - url: /api/v1
tags:
  - name: translation
  - name: speech
  - name: segment
  - name: webpage
  - name: service
paths:
  /speech:
    post:
      tags: [speech]
      operationId: speak
      summary: Read a text aloud
      description: |
        Returns the audio of the whole text as one WAV file (22.05 kHz, mono, 16-bit PCM). The
        text is spoken as it is given: the server does not strip Markdown or split long input.

        **Closing the connection.** What it does depends on how far the utterance got:

        - *Waiting in the queue, or handed to the engine but not started:* the utterance is
          dropped and its place is released at once.
        - *Being synthesized:* the server stops answering at once and the engine aborts within a
          few hundredths of a second (it checks before every decoding step, diffusion step and
          the vocoder). The request keeps its place in the speech queue until the engine has
          confirmed the stop, so the next request starts only after that, never beside the
          stopping one. Three phases cannot be interrupted and run to their end first: the
          conditioning before the first step, a model load (the first request, or after an idle
          unload) and a voice separation started by `POST /voices`.
        - *Finished:* there is nothing to cancel. With `audio/ogg` or `audio/qoa` the first byte is sent only
          after the synthesis is over, so a disconnect during the synthesis is the cancel case
          above.

        A client that names `audio/ogg` in `Accept` gets the same audio as Ogg Opus instead
        (`Content-Type: audio/ogg; codecs=opus`): mono, 48 kHz CELT (the audio is resampled
        to it), about 64 kbit/s, about a twelfth of the size, sent in pages of about a second. One that
        names `audio/qoa` gets a [QOA](https://qoaformat.org) stream: lossy, about a fifth of the
        size, sent in chunks of whole frames (a streaming file, sample count 0 in its header) so
        that the client can decode while it receives. The engine still returns the utterance
        whole, so the first byte of either is sent when the synthesis is over. Only a header
        that names the type with a weight above 0 selects it, the heavier of the two first and
        Opus on a tie; `*/*`, `audio/*` and no header give WAV, and so does a server whose
        encoder is not installed (`vendor/minicelt`, `public/vendor/qoa`) when no other named
        type can be sent, so a client must go by the `Content-Type` of the answer. The web app
        asks for Opus when its browser decodes it, then QOA, and uses WAV only when neither
        works.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeechRequest"
            examples:
              plain:
                value:
                  text: Reading is a way of thinking with another person's mind.
                  lang: en
              voiceAndSpeed:
                value:
                  text: 今天天气很好，我们一起去公园散步吧。
                  lang: zh
                  voice: voice_05
                  speed: 1.25
      responses:
        "200":
          description: The spoken text.
          headers:
            Vary:
              description: Always `accept`, since the format depends on it.
              schema:
                type: string
          content:
            audio/wav:
              schema:
                type: string
                format: binary
            audio/ogg:
              schema:
                type: string
                format: binary
            audio/qoa:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: The request body exceeds 4 MiB (`body_too_large`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/QueueFull"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: The speech engine failed to load its model or to synthesize the text (`speech_error`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: |
            Reading aloud is not available (`speech_unavailable`): it is turned off, the speech
            engine or its model is not installed, or there is no voice. The message says which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /voices:
    get:
      tags: [speech]
      operationId: listVoices
      summary: Voices, languages and limits for reading aloud
      responses:
        "200":
          description: Whether speech can be used, and with which voices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceList"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [speech]
      operationId: addVoice
      summary: Upload a voice sample for cloning
      description: |
        The body is a WAV recording (`audio/wav`, at most `max_sample_bytes`) of the voice to
        imitate. It must last between `sample_seconds.min` and `sample_seconds.max` seconds, have the
        sample rate `sample_rate` (44.1 kHz; the server does not resample), and be mono or stereo
        (`400` otherwise). It becomes a voice in `GET /voices`
        until the server stops; nothing is persisted. At most `max_voices` uploads exist at once:
        once that many are stored, the next upload is refused with `400` (`invalid_request`,
        `details.field` `body`) and nothing is evicted.

        When the voice separation model (BS-RoFormer) is installed, the voice is first taken out of
        music and background noise, and the separated voice is what is kept. The speech model is
        unloaded while that runs (a few seconds, depending on the length) and loaded again by the
        next utterance; utterances requested meanwhile wait for it. Without the model the sample
        is kept as it was uploaded.
      parameters:
        - name: name
          in: query
          schema:
            type: string
          description: |
            Display name. Runs of whitespace are collapsed to one space, the ends are trimmed and
            anything beyond `max_name_chars` characters (see `GET /voices`) is cut off, not
            rejected. A blank or missing name becomes `Uploaded voice`.
      requestBody:
        required: true
        content:
          audio/wav:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: The new voice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voice"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: The sample exceeds `max_sample_bytes` (`body_too_large`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: The engine failed to separate the voice from the recording (`speech_error`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Reading aloud is not available (`speech_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /segment:
    post:
      tags: [segment]
      operationId: segment
      summary: Where sentences are likely to end
      description: |
        For each text in `texts`, the positions after which a sentence may end, each with the
        model's probability that one does. The model reads subwords, so a position is always the
        end of one (in a language written with spaces, usually the end of a word or of a
        punctuation mark); positions whose probability is below 0.001 are left out. The texts are
        read as they are given: the server does not trim, normalize or join them, and one text
        never sees another, so a client sends each block (paragraph, list item) as its own text.
        Text in any language is accepted; the model was trained on 85.

        Positions count UTF-16 code units from the start of the text, as JavaScript strings do: a
        position `p` means `text.slice(0, p)` could be a sentence and `text.slice(p)` the rest.

        A request holds at most `max_chars` UTF-16 code units in all (see `segment` in
        `GET /health`); a longer document is sent in several requests. Requests run one at a time
        on their own thread, beside translations and speech, and have their own queue of the same
        size as those (`429`). Closing the connection drops a waiting request; a running one stops
        within one batch of the model (a few hundredths of a second).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SegmentRequest"
            example:
              texts:
                - The library reopened last month. It seats 214 visitors, and volunteers meet on Thursdays.
                - 月球是地球唯一的天然衛星。它的直徑約為地球的四分之一。
      responses:
        "200":
          description: One entry per text, in the same order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Segmentation"
              example:
                texts:
                  - offsets: [32, 38, 88]
                    probabilities: [0.982, 0.004, 0.991]
                  - offsets: [13, 27]
                    probabilities: [0.973, 0.988]
        "400":
          description: |
            `texts` is missing, not an array of strings, empty, has more than 256 entries, or holds more
            than `max_chars` UTF-16 code units in all (`invalid_request`, `details.field` `texts`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: The request body exceeds 4 MiB (`body_too_large`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/QueueFull"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: The segmentation model failed to load or to run (`segment_error`). A failed load is attempted again by the next request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: |
            Sentence segmentation is not available (`segment_unavailable`): it is turned off, or ONNX
            Runtime or the model is not installed. The message says which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /translate:
    post:
      tags: [translation]
      operationId: translate
      summary: Translate text
      description: |
        Returns JSON by default. Set `stream: true` in the body to receive Server-Sent Events
        instead. `stream` is the only selector: the `Accept` header is ignored, so a request that
        asks for `text/event-stream` without `stream: true` gets JSON. The `Content-Type` of the
        answer says which format it is.

        Request validation (`400`) and the queue (`429`) are checked before the response
        starts, so they are reported with an HTTP status in both modes. The body must be declared
        as `application/json` (`415`), and browser requests must pass the Host and Origin checks
        (`403`); see `ALLOWED_ORIGINS` and `ALLOWED_HOSTS` in the README. Everything after that
        happens in the queue or the engine, and is reported with an HTTP status in JSON mode and
        as an `error` event in SSE mode, because the stream has already started by then:

        | Condition | Status | Code | Retry |
        |---|---|---|---|
        | The prompt exceeds the input limit, or leaves no room for a translation | `413` | `input_too_long` | No; shorten the input |
        | An `image` was sent and the model's image encoder file is not installed | `503` | `image_unavailable` | After installing the file |
        | The engine failed to generate, or the requested model failed to load | `502` | `engine_error` | Yes; a failed load is attempted again by the next request |
        | The engine's own image decoder rejects the image | `400` | `invalid_request` (`details.field` is `image`) | No; send another image |
        | Anything unexpected | `500` | `internal_error` | Maybe |

        `engine_unavailable` is not used here; it belongs to `POST /tokenize`. A translation
        request never fails because a model is loading: it waits in the queue.

        With an `image` the request translates the text in that image; see `TranslateRequest`.
        The image is checked in two stages. Before the queue the server decodes it: an upload
        that is not a JPEG, PNG or WebP image it can decode is a `400` (`invalid_request`), one
        that is too large a `413` (`image_too_large`), in both modes. The image is then handed to
        the model's own decoder after the request has waited its turn; a failure there is the
        `400` in the table (an `error` event with code `invalid_request` in SSE mode). It is
        rare, because the server re-encodes every upload itself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranslateRequest"
            examples:
              plain:
                summary: Plain translation
                value:
                  text: 你好，世界。今天天气不错。
                  target_lang: en
              constrained:
                summary: Glossary and style constraints
                value:
                  text: 王平仲采用了更加昂贵的碳纤维材料。碳纤维的好处就是它抗裂缝。
                  source_lang: zh
                  target_lang: en
                  genre: 专栏文章
                  glossary:
                    碳纤维: carbon fiber
                    抗裂缝: crack resistance
                  soft_constraints:
                    - 保持专业严谨的技术工程文档风格
                  stream: true
              document:
                summary: Whole document with NativeLong
                value:
                  model: index-nailong-9b
                  text: "The town library reopened last month after a renovation that took far longer than anyone had planned.\n\nThe old reading room has been replaced by a bright hall."
                  source_lang: en
                  target_lang: zh
              image:
                summary: The text in an image
                value:
                  image: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACAQAAAABazTCJAAAADElEQVQI12M4wHAAAAMEAYHFO6KpAAAAAElFTkSuQmCC
                  target_lang: zh
      responses:
        "200":
          description: "The translation, as one JSON document (`stream` false or absent) or as an event stream (`stream: true`)."
          headers:
            X-Translation-Id:
              description: |
                Only on an event stream started with `resumable: true`: the id for
                `GET /translations/{id}/events` and `DELETE /translations/{id}`.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranslateResponse"
            text/event-stream:
              schema:
                type: string
                description: |
                  A stream of events, each formatted as

                  ```
                  event: <name>
                  data: <one JSON object on a single line>

                  ```

                  Events arrive in this order:

                  | Event | Occurs | Data schema |
                  |---|---|---|
                  | `queued` | zero or more times, while waiting | `QueuedEvent` |
                  | `start` | once, when generation begins | `StartEvent` |
                  | `delta` | zero or more times | `DeltaEvent` |
                  | `done` | once, on success; last event | `DoneEvent` |
                  | `error` | once, on failure or cancellation; last event | `ErrorEvent` |

                  Every event also carries an `id:` line before `event:`: a number counting up
                  from 1 with no gaps, on every stream, resumable or not. Only a resumable
                  stream can be read again with it.

                  A stream always ends with `done` or `error`. A stream that ends without
                  either was cut by the network, not finished: a resumable one can be read
                  again, any other cannot. A resumable translation that is cancelled (by
                  `DELETE /translations/{id}` or because nobody read it for two minutes) ends
                  with an `error` event with code `cancelled`.

                  The translation is the concatenation of all `delta.text` values; it has no
                  leading or trailing whitespace. Comment lines (starting with `:`) are sent as
                  keep-alives and must be ignored.
              example: |
                event: start
                data: {"model":"index-translate-9b","prompt_tokens":45,"max_output_tokens":65427,"queue_ms":0}

                event: delta
                data: {"text":"你好"}

                event: delta
                data: {"text":"，世界"}

                event: done
                data: {"finish_reason":"stop","usage":{"prompt_tokens":45,"completion_tokens":4},"timings":{"queue_ms":0,"prompt_ms":91,"generation_ms":57,"tokens_per_second":70.2}}

        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/QueueFull"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/EngineError"
        "503":
          description: |
            The request has an image and the model's image encoder is not installed on the server
            (`image_unavailable`); the message names the file and how to download it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /translations/{id}/events:
    get:
      tags: [translation]
      operationId: resumeTranslation
      summary: Read a streamed translation again
      description: |
        A streamed translation started with `resumable: true` keeps running when the connection
        drops (for example when a phone puts the page in the background) and its events are kept.
        This returns them again as Server-Sent Events, starting after the event numbered by the
        `Last-Event-ID` header (or the `after` query parameter); with neither, from the first.
        Every event carries an `id:` line, a number counting up from 1 with no gaps.

        - **Position.** Only events after the given number are sent, never the given one again.
          If both `Last-Event-ID` and `after` are present, the header wins. A value that is not a
          non-negative integer is read as 0 (from the first event), not refused. A number beyond
          the last event so far sends nothing yet, then every event that follows.
        - **Live or finished.** A running translation is replayed and then followed live until its
          last event; a finished one is replayed and the stream closes.
        - **One reader.** A new reader takes the translation over: a connection that was still
          reading it is closed by the server.
        - **No reader.** A running translation that nobody reads for two minutes is cancelled, and
          a finished or cancelled one is kept for ten minutes (the server also keeps only a
          limited number of finished ones). A cancelled translation, whether by this timeout or by
          `DELETE`, ends its events with an `error` event with code `cancelled`, so a reader that
          reconnects after a cancellation receives the events so far and that terminal event.
        - **Gone.** After that, or for an id that never existed or was not resumable, the answer
          is `404` (`not_found`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The `X-Translation-Id` response header of the `POST /translate` that started it.
        - name: after
          in: query
          schema:
            type: integer
            minimum: 0
          description: Same as `Last-Event-ID`.
        - name: Last-Event-ID
          in: header
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: The events after the given one; the same format as `POST /translate`.
          content:
            text/event-stream:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /translations/{id}:
    delete:
      tags: [translation]
      operationId: cancelTranslation
      summary: Cancel a resumable translation
      description: |
        Stops a translation started with `resumable: true` now, instead of after the two-minute
        grace period. A reader that is attached receives the `error` event with code `cancelled`
        and the stream closes. Cancelling a translation that has already finished or been
        cancelled changes nothing and is also a `204`, until the server forgets it (ten minutes
        after it ended), after which it is a `404`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Cancelled (or already finished or cancelled).
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /tokenize:
    post:
      tags: [translation]
      operationId: tokenize
      summary: Count the tokens a translation request would use
      description: |
        Accepts the text fields of a `POST /translate` body (`TokenizeRequest`, the same rules
        for `model`, `source_lang`, glossary, constraints and `genre`) and reports the size of
        the resulting prompt without translating anything. It has no `image`: an image is counted
        by preparing it for the model, which only a translation waits for. A body that carries
        one is refused (`400`, `details.field` `image`). The output and streaming fields of a
        translation (`max_output_tokens`, `stream`, `resumable`) are not part of this request.
        An input that is too long is reported with `fits: false`, not with an error.

        Tokenizing never waits in the queue, never uses a slot and never loads or swaps a model,
        so it can run while a translation is in progress. The prompt is built for the requested
        `model`, but it is counted by the model that is loaded now, named in `counted_with`. The
        two checkpoints are 9B siblings that share a tokenizer family, so the count is taken to
        match the requested model's. If no model is ready (loading, failed or stopped), the
        answer is `503` with `engine_unavailable`.

        Like `/translate`, it requires `Content-Type: application/json` (`415`) and passes the
        Host and Origin checks (`403`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenizeRequest"
      responses:
        "200":
          description: Token count and the output room left in the context window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenizeResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "413":
          description: The request body exceeds 4 MiB (`body_too_large`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: No model is ready to count with (`engine_unavailable`). Retry after the `Retry-After` delay.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Suggested delay in seconds (2).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /webpage:
    post:
      tags: [webpage]
      operationId: fetchWebpage
      summary: Fetch a web page as Markdown
      description: |
        Opens `url` in a headless browser on the server (the system WebKit on macOS, an installed
        Chrome, Chromium, Edge or Brave elsewhere), waits for the page to load (at most 30
        seconds, then it is read as it is), lets its scripts render until the page has not changed for
        half a second (at most five seconds more), and answers its content as Markdown. Nothing is
        translated: the client puts the Markdown in front of the user, who translates it with
        `POST /translate`.

        The page runs its scripts as in a browser, in a private session without cookies, so what
        is taken is what a reader who is not signed in sees. When the page marks its content with
        one `<main>` (or `role="main"`) the rest is left out, and within it one `<article>` if
        there is exactly one. Navigation, sidebars, the page's own header and footer, forms,
        scripts and whatever the page hides are left out. Links and images keep absolute
        addresses; a link that is not `http`, `https` or `mailto` keeps only its text.

        The server opens only hosts that `ALLOWED_WEBPAGE_DOMAINS` covers (`example.com`,
        `*.example.com` for its subdomains, or `*` for any host), on any port; anything else is
        refused (`403`, `forbidden_webpage`). A page that redirects, or whose script moves on, to
        a host outside the list is refused too, but the browser will have made that request. With
        no domains listed every request is `503` (`webpage_unavailable`), and `webpage` in
        `GET /health` says so.

        At most two pages are fetched at a time (`429`, `queue_full`); a fetch takes at most 60
        seconds. Closing the connection stops it. It does not use the translation queue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebpageRequest"
            example:
              url: https://example.com/articles/42
      responses:
        "200":
          description: The page's content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webpage"
        "400":
          description: "`url` is missing or not an absolute `http` or `https` address (`invalid_request`, `details.field` `url`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: |
            The page's host is not in `ALLOWED_WEBPAGE_DOMAINS`, or the page went on to one that is
            not (`forbidden_webpage`); or the call itself is refused, see `Forbidden`
            (`forbidden_origin`, `forbidden_host`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The request body exceeds 4 MiB (`body_too_large`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          description: Two pages are being fetched already (`queue_full`).
          headers:
            Retry-After:
              schema:
                type: integer
              description: Suggested delay in seconds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: |
            The page could not be opened (the name does not resolve, the connection fails), did not
            finish within 60 seconds, or could not be read (`webpage_error`). The message says which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: |
            Fetching web pages is not available (`webpage_unavailable`): no domains are allowed, the
            Markdown converter (turndown) is not installed, or no browser was found. The message says which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /models:
    get:
      tags: [service]
      operationId: listModels
      summary: List the available models and the one loaded now
      responses:
        "200":
          description: Model identifiers, their kind and, for document models, the directions they accept.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /languages:
    get:
      tags: [service]
      operationId: listLanguages
      summary: List languages with a short code
      description: |
        The codes listed here are the ones the backend maps to the language names used in the
        model's training prompts. The model supports more languages than this list; any other
        language can be requested by passing its name (preferably in Chinese, for example
        `斯瓦希里语`) as `source_lang` or `target_lang`. The `index-nailong-9b` model accepts
        only the four codes listed in `GET /models`.
      responses:
        "200":
          description: Known language codes.
          content:
            application/json:
              schema:
                type: object
                required: [languages]
                properties:
                  languages:
                    type: array
                    items:
                      $ref: "#/components/schemas/Language"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /health:
    get:
      tags: [service]
      operationId: getHealth
      summary: Service and engine status
      description: |
        `status` is `ready` only when a model is loaded and idle or busy. `loading` means a model
        is being loaded (a request for a different model causes this), `stopped` means no model
        is loaded yet (startup), and `error` means the last load failed; the next request for
        that model tries again.
      responses:
        "200":
          description: The engine is ready to translate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The engine is not ready. The body is the same `Health` document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /openapi.yaml:
    get:
      tags: [service]
      operationId: getSpec
      summary: This document
      responses:
        "200":
          description: The OpenAPI description of the API.
          content:
            application/yaml:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  responses:
    InvalidRequest:
      description: |
        The body is not a JSON object, a field is invalid (`invalid_request`), or the model
        does not accept the request (`unsupported_language_pair`). `details.field` names the
        offending field when there is one.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: invalid_request
              message: text must be a non-empty string
              details:
                field: text
    TooLarge:
      description: |
        One of:

        - the prompt exceeds the input token limit (`input_too_long`, with `details.prompt_tokens`
          and `details.max_input_tokens`);
        - the prompt is within that limit but leaves no room for a translation in the context
          window (`input_too_long`, with `details.prompt_tokens` and `details.context_tokens`);
        - the request body without its `image` exceeds 4 MiB (`body_too_large`);
        - the image is over 8 MiB or 50 million pixels (`image_too_large`, with
          `details.field` `image`; `details.max_image_bytes` when it is the size).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: input_too_long
              message: the input exceeds the token limit for a single translation
              details:
                prompt_tokens: 31250
                max_input_tokens: 28000
    QueueFull:
      description: |
        Too many translations, speech requests or segmentation requests are already waiting
        (`queue_full`); each has its own queue.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Suggested delay in seconds.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    EngineError:
      description: |
        The inference engine failed while handling the request (`engine_error`): a generation
        failed, or the requested model could not be loaded. The message says which. A failed load
        is attempted again by the next request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: An unexpected server failure (`internal_error`); the details are in the server log.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MethodNotAllowed:
      description: |
        The path exists but not for this method (`method_not_allowed`). Not listed per operation;
        it can answer any `/api/v1` path.
      headers:
        Allow:
          description: The methods the path accepts.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: "The body is not declared as `Content-Type: application/json` (`unsupported_media_type`)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        A browser page from another origin called the API (`forbidden_origin`), or the request's
        Host header is not loopback, `HOST` or in `ALLOWED_HOSTS` (`forbidden_host`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such translation; it never existed, was not resumable, or has expired (`not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    TranslateRequest:
      type: object
      required: [target_lang]
      description: |
        Either `text` or `image` is required. A text-only request needs a `text` with a
        non-whitespace character; with an `image` the `text` is optional and only says what to
        look at.

        The conditional rules below are enforced by the server (`400`, `details.field` names the
        field). They apply to the model the request names, or to the default model of
        `GET /models` when it names none:

        - `index-nailong-9b` needs a `source_lang` other than `auto`, takes no `glossary`,
          `hard_constraints`, `soft_constraints`, `genre` or `image`, and only translates the
          directions listed in `GET /models` (`400`, `unsupported_language_pair`, otherwise).
        - An `image` request takes no `genre`.
        - `resumable: true` needs `stream: true`.
      allOf:
        - anyOf:
            - required: [image]
              properties:
                image:
                  type: string
            - required: [text]
              properties:
                text:
                  type: string
                  pattern: '\S'
        - if:
            required: [model]
            properties:
              model:
                const: index-nailong-9b
          then:
            required: [source_lang]
            properties:
              source_lang:
                pattern: '\S'
                not:
                  pattern: '^\s*[Aa][Uu][Tt][Oo]\s*$'
              glossary:
                maxProperties: 0
              hard_constraints:
                maxItems: 0
              soft_constraints:
                maxItems: 0
              genre: false
              image: false
        - if:
            required: [image]
            properties:
              image:
                type: string
          then:
            properties:
              genre:
                maxLength: 0
        - if:
            required: [resumable]
            properties:
              resumable:
                const: true
          then:
            required: [stream]
            properties:
              stream:
                const: true
      properties:
        model:
          type: string
          enum: [index-translate-9b, index-nailong-9b]
          default: index-translate-9b
          description: |
            Which checkpoint translates the request; see `GET /models`. Requests that name a
            different model than the one loaded cause a model switch.
        text:
          type: string
          description: |
            Source text. Without an `image` it is required and must contain a non-whitespace
            character; surrounding whitespace is ignored. With an `image` it is optional and is
            not translated: it tells the model what to look at in the image.
        image:
          type: string
          maxLength: 11184876
          description: |
            An image whose text is translated, as base64 or as a `data:` URL holding base64. JPEG,
            PNG or WebP, at most 8 MiB and 50 million pixels; transparency is shown on white.
            Only for models with `image: true` in `GET /models`. `glossary`, `hard_constraints`
            and `soft_constraints` apply; `genre` is not accepted. Not accepted by
            `POST /tokenize`.
        target_lang:
          type: string
          minLength: 1
          maxLength: 64
          description: A code from `GET /languages` (case-insensitive) or a language name. For `index-nailong-9b`, a code that completes a supported direction.
          examples: [en, zh, 斯瓦希里语]
        source_lang:
          type: string
          maxLength: 64
          default: auto
          description: |
            A language code or name. `auto` (or omitting the field) lets the model detect the
            language. Required by `index-nailong-9b`, which has no detection.
        glossary:
          type: object
          additionalProperties:
            type: string
          description: Required term translations, source term to target term. Enforced as a hard constraint. Not accepted by `index-nailong-9b`.
          examples:
            - 碳纤维: carbon fiber
        hard_constraints:
          type: array
          items:
            type: string
          description: |
            Requirements that must hold, such as preserving JSON structure, placeholders or
            code. The model was trained on Chinese instructions; write them in Chinese for
            best adherence. Not accepted by `index-nailong-9b`.
          examples:
            - [保留源文中的 JSON 格式标记不变]
        soft_constraints:
          type: array
          items:
            type: string
          description: Graded requirements such as tone, register or domain context. Not accepted by `index-nailong-9b`.
          examples:
            - [调整为严谨、正式、礼貌的商务公文风格]
        genre:
          type: string
          maxLength: 64
          description: |
            Genre or domain of the source, such as `专栏文章`, `学术论文`, `小说` or `字幕`.
            Only used when a glossary or constraint is present, and then `文本` is assumed when
            it is left out. Not accepted by `index-nailong-9b` or together with an `image`.
        max_output_tokens:
          type: integer
          minimum: 1
          description: |
            Cap on generated tokens. Defaults to four times the prompt size plus 512, which
            stops a translation that has gone into a loop. Both the default and an explicit
            value are clamped to the context space left after the prompt.
        stream:
          type: boolean
          default: false
          description: |
            Respond with Server-Sent Events. This is the only selector of the response format: the
            `Accept` header of `POST /translate` is ignored.
        resumable:
          type: boolean
          default: false
          description: |
            Requires `stream: true` (`400` otherwise). The translation survives a dropped
            connection: the response carries an `X-Translation-Id` header, and
            `GET /translations/{id}/events` reads the events again. Without it, closing the
            connection cancels the translation at once.
    TranslateResponse:
      type: object
      required: [translation, finish_reason, model, usage, timings]
      properties:
        translation:
          type: string
        finish_reason:
          $ref: "#/components/schemas/FinishReason"
        model:
          type: string
          examples: [index-translate-9b]
        usage:
          $ref: "#/components/schemas/Usage"
        timings:
          $ref: "#/components/schemas/Timings"
    TokenizeRequest:
      type: object
      required: [text, target_lang]
      description: |
        The text fields of `TranslateRequest`, with the same meaning and the same conditional
        rules for `index-nailong-9b`. There is no `image` (a body that carries one is refused with
        `400`), and no `max_output_tokens`, `stream` or `resumable`: nothing is generated.
        `text` is required and needs a non-whitespace character.
      allOf:
        - if:
            required: [model]
            properties:
              model:
                const: index-nailong-9b
          then:
            required: [source_lang]
            properties:
              source_lang:
                pattern: '\S'
                not:
                  pattern: '^\s*[Aa][Uu][Tt][Oo]\s*$'
              glossary:
                maxProperties: 0
              hard_constraints:
                maxItems: 0
              soft_constraints:
                maxItems: 0
              genre: false
      properties:
        model:
          $ref: "#/components/schemas/TranslateRequest/properties/model"
        text:
          type: string
          pattern: '\S'
          description: Source text; surrounding whitespace is ignored.
        target_lang:
          $ref: "#/components/schemas/TranslateRequest/properties/target_lang"
        source_lang:
          $ref: "#/components/schemas/TranslateRequest/properties/source_lang"
        glossary:
          $ref: "#/components/schemas/TranslateRequest/properties/glossary"
        hard_constraints:
          $ref: "#/components/schemas/TranslateRequest/properties/hard_constraints"
        soft_constraints:
          $ref: "#/components/schemas/TranslateRequest/properties/soft_constraints"
        genre:
          $ref: "#/components/schemas/TranslateRequest/properties/genre"
    TokenizeResponse:
      type: object
      required: [model, counted_with, prompt_tokens, fits, available_output_tokens, limits]
      properties:
        model:
          type: string
          description: The model the prompt is built for (the requested one).
        counted_with:
          type: string
          description: The loaded model whose tokenizer counted the prompt. Equals `model` when that one is loaded.
        prompt_tokens:
          type: integer
          description: Tokens the full prompt occupies, including the instruction and chat template.
        fits:
          type: boolean
          description: Whether `prompt_tokens` is within `limits.max_input_tokens`.
        available_output_tokens:
          type: integer
          minimum: 0
          description: |
            The most tokens a translation of this prompt could generate: `limits.context_tokens`
            minus `prompt_tokens` minus a small safety margin the server keeps free, never below
            0. It is a ceiling, not the budget a translation gets by default (four times the
            prompt plus 512, clamped to this), which a request can also lower with
            `max_output_tokens`; the `start` event reports the budget in effect.
        limits:
          $ref: "#/components/schemas/Limits"
    ModelList:
      type: object
      required: [default, loaded, models]
      properties:
        default:
          type: string
          description: The model used when a request names none.
        loaded:
          type: [string, "null"]
          description: The model whose engine is running now, or null before the first load.
        models:
          type: array
          items:
            $ref: "#/components/schemas/ModelInfo"
        image:
          type: object
          description: What an `image` in a translation request may be.
          required: [formats, max_bytes, max_pixels]
          properties:
            formats:
              type: array
              items:
                type: string
              examples:
                - [image/jpeg, image/png, image/webp]
            max_bytes:
              type: integer
              description: Largest image file.
            max_pixels:
              type: integer
              description: Largest width times height.
    ModelInfo:
      type: object
      required: [id, label, kind, image]
      properties:
        id:
          type: string
          enum: [index-translate-9b, index-nailong-9b]
        label:
          type: string
        kind:
          type: string
          enum: [chat, document]
          description: |
            `chat` translates free text with optional glossary and constraints. `document`
            translates a whole text with a fixed prompt and takes no options beyond the language
            pair and output budget.
        image:
          type: boolean
          description: |
            Whether the model translates the text in an image. Its image encoder is a separate
            file; a request finds out whether that is installed (`503 image_unavailable`).
        directions:
          type: array
          items:
            type: string
            examples: [zh-en]
          description: Accepted `<source>-<target>` codes, for document models only.
    FinishReason:
      type: string
      enum: [stop, length]
      description: |
        `stop`: the model ended the translation itself. `length`: the output budget ran out
        and the translation is truncated.
    Usage:
      type: object
      required: [prompt_tokens, completion_tokens]
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
    Timings:
      type: object
      required: [queue_ms, prompt_ms, generation_ms, tokens_per_second]
      properties:
        queue_ms:
          type: integer
          description: Time spent waiting for the engine, including any model switch.
        prompt_ms:
          type: integer
          description: Time the engine spent reading the prompt.
        generation_ms:
          type: integer
          description: Time the engine spent generating the translation.
        tokens_per_second:
          type: number
          description: Generation speed.
    Limits:
      type: object
      required: [context_tokens, max_input_tokens]
      properties:
        context_tokens:
          type: integer
          description: Context window shared by the prompt and the translation.
          examples: [65536]
        max_input_tokens:
          type: integer
          description: Largest accepted prompt.
          examples: [28000]
    Language:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          examples: [zh]
        name:
          type: string
          description: English name of the language.
          examples: [Chinese]
    Health:
      type: object
      required: [status, model, limits, queue]
      properties:
        status:
          type: string
          enum: [loading, ready, error, stopped]
        error:
          type: string
          description: Present when `status` is `error`.
        model:
          type: [string, "null"]
          description: The loaded model, or null when none is loaded.
        limits:
          $ref: "#/components/schemas/Limits"
        gpu_memory:
          type: object
          description: |
            Memory of the GPU the model runs on (several GPUs added up), as the Vulkan driver reports
            it for the whole device: it includes other programs and the speech engine. Absent while no
            model is ready, without a GPU, and when the engine thread cannot answer within half a
            second (a model is loading). A reading is up to a second old.
          required: [total_bytes, free_bytes]
          properties:
            total_bytes:
              type: integer
              format: int64
            free_bytes:
              type: integer
              format: int64
        queue:
          type: object
          required: [running, waiting, max_waiting]
          properties:
            running:
              type: boolean
              description: Whether a translation is in progress.
            waiting:
              type: integer
            max_waiting:
              type: integer
        speech:
          type: object
          description: The speech engine. It does not affect `status` or the HTTP status of this endpoint.
          required: [status]
          properties:
            status:
              $ref: "#/components/schemas/SpeechStatus"
            error:
              type: string
              description: Why speech is `unavailable`, or why the model could not be loaded last time.
        segment:
          type: object
          description: The sentence segmentation model (`POST /segment`). It does not affect `status` or the HTTP status of this endpoint.
          required: [status, max_chars]
          properties:
            status:
              $ref: "#/components/schemas/SegmentStatus"
            error:
              type: string
              description: Why segmentation is `unavailable`, or why the model could not be loaded last time.
            max_chars:
              type: integer
              description: Most UTF-16 code units one `POST /segment` may hold in all its texts.
              examples: [20000]
        webpage:
          type: object
          description: |
            `POST /webpage`. `available` when domains are allowed and the Markdown converter is
            installed; whether a browser is there shows only when a page is fetched.
          required: [status]
          properties:
            status:
              type: string
              enum: [available, unavailable]
            error:
              type: string
              description: Why fetching web pages is `unavailable`.
    WebpageRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          maxLength: 8192
          description: An absolute `http` or `https` address, without a user name or password.
    Webpage:
      type: object
      required: [url, title, markdown]
      properties:
        url:
          type: string
          description: Where the page ended up, after redirects.
        title:
          type: string
          description: The page's title; empty when it has none.
        markdown:
          type: string
          description: The page's content as Markdown (CommonMark, ATX headings, fenced code); empty when it has no text.
    SpeechStatus:
      type: string
      enum: [unavailable, stopped, starting, ready, error]
      description: |
        `unavailable`: turned off, or the engine or its model is not installed. `stopped`:
        installed, the model is not loaded; a `POST /speech` loads it (`starting`, then `ready`)
        and it is unloaded again when idle. `error`: the last load failed; the next request tries
        again.
    SegmentStatus:
      type: string
      enum: [unavailable, stopped, starting, ready, error]
      description: |
        `unavailable`: turned off, or ONNX Runtime or the model is not installed. `stopped`:
        installed, the model is not loaded; a `POST /segment` loads it (`starting`, then `ready`)
        and it is unloaded again when idle. `error`: the last load failed; the next request tries
        again.
    SegmentRequest:
      type: object
      required: [texts]
      properties:
        texts:
          type: array
          minItems: 1
          maxItems: 256
          items:
            type: string
          description: |
            The texts to read, each on its own (a blank one gets no positions). At most `max_chars`
            UTF-16 code units in all, see `segment` in `GET /health`.
    Segmentation:
      type: object
      required: [texts]
      properties:
        texts:
          type: array
          description: One entry per requested text, in the same order.
          items:
            $ref: "#/components/schemas/SegmentedText"
    SegmentedText:
      type: object
      required: [offsets, probabilities]
      description: |
        Two arrays of the same length: `offsets[i]` is a position where a sentence may end and
        `probabilities[i]` the model's probability that it does. Offsets are in UTF-16 code units,
        ascending, from 1 to the text's length; positions below a probability of 0.001 are absent.
      properties:
        offsets:
          type: array
          items:
            type: integer
            minimum: 1
        probabilities:
          type: array
          items:
            type: number
            minimum: 0
            maximum: 1
          description: Rounded to three significant digits.
    SpeechRequest:
      type: object
      required: [text, lang]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1000
          description: The text to speak, at most 1,000 characters. Must contain a non-blank character.
        lang:
          type: string
          enum: [zh, en, ja, es, ar]
          description: Language of the text.
        voice:
          type: string
          description: A voice id from `GET /voices`. Default is the first voice listed.
        speed:
          type: number
          minimum: 0.5
          maximum: 2
          default: 1
          description: |
            Speaking rate; 2 is twice as fast. This is the model's duration control (the audio
            lasts 1/speed as long), not faster playback.
    Voice:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: File name of the reference recording in the voices directory, without `.wav`.
        name:
          type: string
    VoiceList:
      type: object
      description: |
        The limits are always present, also while speech is `unavailable`, so a client can
        validate a recording before it uploads it.
      required:
        - status
        - languages
        - speed
        - max_chars
        - max_sample_bytes
        - sample_seconds
        - sample_rate
        - max_voices
        - max_name_chars
        - voices
      properties:
        status:
          $ref: "#/components/schemas/SpeechStatus"
        error:
          type: string
          description: Why speech is `unavailable`, or why the model could not be loaded last time.
        languages:
          type: array
          items:
            type: string
        speed:
          type: object
          required: [min, max]
          properties:
            min:
              type: number
            max:
              type: number
        max_chars:
          type: integer
          description: Longest `text` of one `POST /speech`.
        max_voices:
          type: integer
          description: How many uploaded voices can exist at once; the next `POST /voices` is refused.
          examples: [16]
        max_name_chars:
          type: integer
          description: Longest voice name kept by `POST /voices`; a longer `name` is cut off.
          examples: [60]
        max_sample_bytes:
          type: integer
          description: Largest body of `POST /voices`.
        sample_seconds:
          type: object
          description: Duration a `POST /voices` recording must have, in seconds.
          required: [min, max]
          properties:
            min:
              type: number
            max:
              type: number
        sample_rate:
          type: object
          description: |
            Sample rate a `POST /voices` recording must have, in Hz. `min` and `max` are equal: the
            voice separation model takes one rate only.
          required: [min, max]
          properties:
            min:
              type: integer
            max:
              type: integer
        voices:
          type: array
          description: Empty when speech is unavailable or the voices directory holds no WAV file.
          items:
            $ref: "#/components/schemas/Voice"
    ErrorDetails:
      type: object
      description: |
        Extra facts about an error. The keys below are the ones the server sets; others may be
        added later, so clients ignore keys they do not know. Which keys appear depends on the
        error `code`, see the operations.
      additionalProperties: true
      properties:
        field:
          type: string
          description: The request field (or `body`) that caused a `400`, or an `image` problem.
        prompt_tokens:
          type: integer
          description: Tokens the prompt occupies (with `input_too_long`).
        max_input_tokens:
          type: integer
          description: The largest accepted prompt (with `input_too_long`).
        context_tokens:
          type: integer
          description: With `input_too_long` when the prompt leaves no room for a translation; the context window.
        max_image_bytes:
          type: integer
          description: With `image_too_large` when the file is too big; the largest image file.
        max_queue:
          type: integer
          description: How many requests may wait (with `queue_full`).
        supported:
          type: array
          items:
            type: string
          description: With `unsupported_language_pair` (the accepted directions) or a bad speech `lang` (the accepted languages).
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          allOf:
            - if:
                required: [code]
                properties:
                  code:
                    const: input_too_long
              then:
                required: [details]
                properties:
                  details:
                    required: [prompt_tokens]
                    anyOf:
                      - required: [max_input_tokens]
                      - required: [context_tokens]
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - unsupported_language_pair
                - input_too_long
                - body_too_large
                - image_too_large
                - image_unavailable
                - queue_full
                - engine_error
                - engine_unavailable
                - speech_error
                - speech_unavailable
                - segment_error
                - segment_unavailable
                - webpage_error
                - webpage_unavailable
                - forbidden_webpage
                - not_found
                - method_not_allowed
                - unsupported_media_type
                - forbidden_origin
                - forbidden_host
                - internal_error
              description: |
                Every code the server can put in an HTTP error response. Each operation lists
                the ones it can return. `cancelled` exists only as the code of an `error` event
                (see `ErrorEvent`): a client that closed its connection never sees a response.
            message:
              type: string
              description: For people, not for programs; its wording can change. Go by `code`.
            details:
              $ref: "#/components/schemas/ErrorDetails"
    QueuedEvent:
      type: object
      required: [position]
      properties:
        position:
          type: integer
          minimum: 1
          description: Number of translations ahead of this one, including the running one.
    StartEvent:
      type: object
      required: [model, prompt_tokens, max_output_tokens, queue_ms]
      properties:
        model:
          type: string
          description: The model that will translate this request.
        prompt_tokens:
          type: integer
        max_output_tokens:
          type: integer
          description: Output budget in effect for this translation.
        queue_ms:
          type: integer
    DeltaEvent:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: The next piece of the translation.
    DoneEvent:
      type: object
      required: [finish_reason, usage, timings]
      properties:
        finish_reason:
          $ref: "#/components/schemas/FinishReason"
        usage:
          $ref: "#/components/schemas/Usage"
        timings:
          $ref: "#/components/schemas/Timings"
    ErrorEvent:
      type: object
      required: [code, message]
      allOf:
        - if:
            required: [code]
            properties:
              code:
                const: input_too_long
          then:
            required: [details]
            properties:
              details:
                required: [prompt_tokens]
                anyOf:
                  - required: [max_input_tokens]
                  - required: [context_tokens]
      properties:
        code:
          type: string
          enum: [input_too_long, engine_error, image_unavailable, invalid_request, internal_error, cancelled]
          description: |
            The code the same failure has in JSON mode (see the table in `POST /translate`):
            `input_too_long` carries the same `details` as the JSON `413`. `engine_error` covers
            both failed generations and failed model loads. `image_unavailable` is the JSON `503`.
            `invalid_request` here is the second image stage: the model's own decoder could not
            read an image the server had accepted (`details.field` is `image`). `cancelled`:
            the resumable translation was cancelled, by `DELETE /translations/{id}` or because
            nobody read it for two minutes; there is no result.
        message:
          type: string
        details:
          $ref: "#/components/schemas/ErrorDetails"
