openapi: 3.1.0
info:
  title: Index Translator API
  version: 1.2.0
  summary: Text translation backed by locally deployed Index-Translate models.
  description: |
    The backend runs Index-Translate models through llama.cpp and exposes them over REST.
    Two checkpoints are available (see `GET /models`):

    - `index-translate-9b`: general translation in any supported language, with glossary and
      constraint support.
    - `index-nailong-9b`: whole-document translation (NativeLong) in four directions only:
      `zh-en`, `en-zh`, `zh-ja` and `ja-zh`. It takes no glossary or constraints.

    The client chooses the model per request with the `model` field. The backend never picks a
    model for the client.

    **Single-pass translation.** A request is translated in one generation; the backend never
    splits the input. Input size is limited in tokens (see `limits` in `GET /health`), and
    `POST /tokenize` reports how many tokens a request would use before it is sent.

    **Model switching.** The GPU holds one model at a time. A request for a model that is not
    loaded waits in the queue, unloads the current model, loads the requested one (this takes
    a few seconds), and then runs. Consecutive requests for the same model do not reload.

    **Streaming.** `POST /translate` returns either one JSON document or a Server-Sent Events
    stream. Because the request needs a body, the stream is consumed with `fetch` (or any HTTP
    client that can read a streamed response), not with the browser `EventSource` API.

    **Concurrency.** One request at a time uses the engine. Further requests wait in a bounded
    FIFO queue; when it is full the backend answers `429`. Closing the connection cancels a
    waiting or running translation.

    **Reading aloud.** `POST /speech` turns one short text into speech with IndexTTS-2.5, which
    runs with its own engine (audio.cpp) beside the translation model. It speaks
    Chinese, English, Japanese, Spanish and Arabic. The model has no built-in voices: a voice is
    a reference recording on the server (`GET /voices`) that the model imitates. One request is
    one utterance, returned whole; a client reads a document by sending it sentence by sentence.
    The speech model is loaded by the first request, which therefore takes a few seconds longer,
    and is unloaded again after a while without requests. Speech requests have their own queue of
    the same size. Closing the connection cancels the utterance: the engine stops within a few
    hundredths of a second and the next request starts. An utterance not yet started is dropped.

    **Errors.** Every error response has the same JSON envelope, see `Error`.
servers:
  - url: /api/v1
tags:
  - name: translation
  - name: speech
  - name: service
paths:
  /speech:
    post:
      tags: [speech]
      operationId: speak
      summary: Read a text aloud
      description: |
        Returns the audio of the whole text as one WAV file (22.05 kHz, mono, 16-bit PCM). The
        text is spoken as it is given: the server does not strip Markdown or split long input.
        Closing the connection gives up the request's place in the queue. An utterance that is
        already being synthesized is finished and thrown away, and the next request waits for it.

        A client that names `audio/qoa` in `Accept` gets the same audio as a
        [QOA](https://qoaformat.org) stream instead: lossy, about a fifth of the size, sent in
        chunks of whole frames (a streaming file, sample count 0 in its header) so that the
        client can decode while it receives. The engine still returns the utterance whole, so the
        first byte is sent when the synthesis is over. Only a header that names `audio/qoa` with
        a weight above 0 selects it; `*/*`, `audio/*` and no header give WAV, and so does a
        server whose QOA codec is not installed (`public/vendor/qoa`), so a client must go by
        the `Content-Type` of the answer. The web app asks for QOA and uses WAV only when its
        browser cannot run WebAssembly or the codec fails.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeechRequest"
            examples:
              plain:
                value:
                  text: Reading is a way of thinking with another person's mind.
                  lang: en
              voiceAndSpeed:
                value:
                  text: 今天天气很好，我们一起去公园散步吧。
                  lang: zh
                  voice: voice_05
                  speed: 1.25
      responses:
        "200":
          description: The spoken text.
          headers:
            Vary:
              description: Always `accept`, since the format depends on it.
              schema:
                type: string
          content:
            audio/wav:
              schema:
                type: string
                format: binary
            audio/qoa:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/QueueFull"
        "502":
          description: The speech engine failed to load its model or to synthesize the text (`speech_error`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: |
            Reading aloud is not available (`speech_unavailable`): it is turned off, the speech
            engine or its model is not installed, or there is no voice. The message says which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /voices:
    get:
      tags: [speech]
      operationId: listVoices
      summary: Voices, languages and limits for reading aloud
      responses:
        "200":
          description: Whether speech can be used, and with which voices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceList"
    post:
      tags: [speech]
      operationId: addVoice
      summary: Upload a voice sample for cloning
      description: |
        The body is a WAV recording (`audio/wav`, at most `max_sample_bytes`) of the voice to
        imitate. It must last between `sample_seconds.min` and `sample_seconds.max` seconds and have a
        sample rate within `sample_rate` (`400` otherwise). It becomes a voice in `GET /voices`
        until the server stops; nothing is persisted. At most 16 uploads are kept.

        When the voice separation model (BS-RoFormer) is installed, the voice is first taken out of
        music and background noise, and the separated voice is what is kept. The speech model is
        unloaded while that runs (a few seconds, depending on the length) and loaded again by the
        next utterance; utterances requested meanwhile wait for it. Without the model the sample
        is kept as it was uploaded.
      parameters:
        - name: name
          in: query
          schema:
            type: string
          description: Display name, at most 60 characters.
      requestBody:
        required: true
        content:
          audio/wav:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: The new voice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voice"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "502":
          description: The engine failed to separate the voice from the recording (`speech_error`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Reading aloud is not available (`speech_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /translate:
    post:
      tags: [translation]
      operationId: translate
      summary: Translate text
      description: |
        Returns JSON by default. Set `stream: true` in the body, or send
        `Accept: text/event-stream`, to receive Server-Sent Events instead.

        Request validation (`400`) and the queue (`429`) are checked before the response
        starts, so they are reported with an HTTP status in both modes. The body must be declared
        as `application/json` (`415`), and browser requests must pass the Host and Origin checks
        (`403`); see `ALLOWED_ORIGINS` and `ALLOWED_HOSTS` in the README. Everything after that
        happens in the queue or the engine: an input over the token limit, a model that fails to
        load, and an engine failure are reported as `413` or `502` in JSON mode, and as an
        `error` event in SSE mode, because the stream has already started by then.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranslateRequest"
            examples:
              plain:
                summary: Plain translation
                value:
                  text: 你好，世界。今天天气不错。
                  target_lang: en
              constrained:
                summary: Glossary and style constraints
                value:
                  text: 王平仲采用了更加昂贵的碳纤维材料。碳纤维的好处就是它抗裂缝。
                  source_lang: zh
                  target_lang: en
                  genre: 专栏文章
                  glossary:
                    碳纤维: carbon fiber
                    抗裂缝: crack resistance
                  soft_constraints:
                    - 保持专业严谨的技术工程文档风格
                  stream: true
              document:
                summary: Whole document with NativeLong
                value:
                  model: index-nailong-9b
                  text: "The town library reopened last month after a renovation that took far longer than anyone had planned.\n\nThe old reading room has been replaced by a bright hall."
                  source_lang: en
                  target_lang: zh
      responses:
        "200":
          description: The translation, as one JSON document or as an event stream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranslateResponse"
            text/event-stream:
              schema:
                type: string
                description: |
                  A stream of events, each formatted as

                  ```
                  event: <name>
                  data: <one JSON object on a single line>

                  ```

                  Events arrive in this order:

                  | Event | Occurs | Data schema |
                  |---|---|---|
                  | `queued` | zero or more times, while waiting | `QueuedEvent` |
                  | `start` | once, when generation begins | `StartEvent` |
                  | `delta` | zero or more times | `DeltaEvent` |
                  | `done` | once, on success; last event | `DoneEvent` |
                  | `error` | once, on failure; last event | `ErrorEvent` |

                  The translation is the concatenation of all `delta.text` values; it has no
                  leading or trailing whitespace. Comment lines (starting with `:`) are sent as
                  keep-alives and must be ignored.
              example: |
                event: start
                data: {"model":"index-translate-9b","prompt_tokens":45,"max_output_tokens":65427,"queue_ms":0}

                event: delta
                data: {"text":"你好"}

                event: delta
                data: {"text":"，世界"}

                event: done
                data: {"finish_reason":"stop","usage":{"prompt_tokens":45,"completion_tokens":4},"timings":{"queue_ms":0,"prompt_ms":91,"generation_ms":57,"tokens_per_second":70.2}}

        "400":
          $ref: "#/components/responses/InvalidRequest"
        "429":
          $ref: "#/components/responses/QueueFull"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/EngineError"
  /tokenize:
    post:
      tags: [translation]
      operationId: tokenize
      summary: Count the tokens a translation request would use
      description: |
        Accepts the same body as `POST /translate` (`stream` and `max_output_tokens` are
        ignored) and reports the size of the resulting prompt without translating anything.
        An input that is too long is reported with `fits: false`, not with an error.

        Tokenizing never waits in the queue, never uses a slot and never loads or swaps a model,
        so it can run while a translation is in progress. The prompt is built for the requested
        `model`, but it is counted by the model that is loaded now, named in `counted_with`. The
        two checkpoints are 9B siblings that share a tokenizer family, so the count is taken to
        match the requested model's. If no model is ready (loading, failed or stopped), the
        answer is `503` with `engine_unavailable`.

        Like `/translate`, it requires `Content-Type: application/json` (`415`) and passes the
        Host and Origin checks (`403`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranslateRequest"
      responses:
        "200":
          description: Token count and remaining budget.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenizeResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "413":
          description: The request body exceeds 4 MiB (`body_too_large`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: No model is ready to count with (`engine_unavailable`). Retry after the `Retry-After` delay.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Suggested delay in seconds (2).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "403":
          $ref: "#/components/responses/Forbidden"
  /models:
    get:
      tags: [service]
      operationId: listModels
      summary: List the available models and the one loaded now
      responses:
        "200":
          description: Model identifiers, their kind and, for document models, the directions they accept.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
  /languages:
    get:
      tags: [service]
      operationId: listLanguages
      summary: List languages with a short code
      description: |
        The codes listed here are the ones the backend maps to the language names used in the
        model's training prompts. The model supports more languages than this list; any other
        language can be requested by passing its name (preferably in Chinese, for example
        `斯瓦希里语`) as `source_lang` or `target_lang`. The `index-nailong-9b` model accepts
        only the four codes listed in `GET /models`.
      responses:
        "200":
          description: Known language codes.
          content:
            application/json:
              schema:
                type: object
                required: [languages]
                properties:
                  languages:
                    type: array
                    items:
                      $ref: "#/components/schemas/Language"
  /health:
    get:
      tags: [service]
      operationId: getHealth
      summary: Service and engine status
      description: |
        `status` is `ready` only when a model is loaded and idle or busy. `loading` means a model
        is being loaded (a request for a different model causes this), `stopped` means no model
        is loaded yet (startup), and `error` means the last load failed; the next request for
        that model tries again.
      responses:
        "200":
          description: The engine is ready to translate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The engine is not ready. The body is the same `Health` document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /openapi.yaml:
    get:
      tags: [service]
      operationId: getSpec
      summary: This document
      responses:
        "200":
          description: The OpenAPI description of the API.
          content:
            application/yaml:
              schema:
                type: string
components:
  responses:
    InvalidRequest:
      description: |
        The body is not a JSON object, a field is invalid (`invalid_request`), or the model
        does not accept the request (`unsupported_language_pair`). `details.field` names the
        offending field when there is one.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: invalid_request
              message: text must be a non-empty string
              details:
                field: text
    TooLarge:
      description: |
        Either the prompt exceeds the input token limit (`input_too_long`, with
        `details.prompt_tokens` and `details.max_input_tokens`), or the request body exceeds
        4 MiB (`body_too_large`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: input_too_long
              message: the input exceeds the token limit for a single translation
              details:
                prompt_tokens: 31250
                max_input_tokens: 28000
    QueueFull:
      description: Too many translations, or too many speech requests, are already waiting (`queue_full`).
      headers:
        Retry-After:
          schema:
            type: integer
          description: Suggested delay in seconds.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    EngineError:
      description: |
        The inference engine failed while handling the request (`engine_error`): a generation
        failed, or the requested model could not be loaded. The message says which.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: "The body is not declared as `Content-Type: application/json` (`unsupported_media_type`)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        A browser page from another origin called the API (`forbidden_origin`), or the request's
        Host header is not loopback, `HOST` or in `ALLOWED_HOSTS` (`forbidden_host`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    TranslateRequest:
      type: object
      required: [text, target_lang]
      properties:
        model:
          type: string
          enum: [index-translate-9b, index-nailong-9b]
          default: index-translate-9b
          description: |
            Which checkpoint translates the request; see `GET /models`. Requests that name a
            different model than the one loaded cause a model switch.
        text:
          type: string
          pattern: "\\S"
          description: Source text. Must contain a non-whitespace character; surrounding whitespace is ignored.
        target_lang:
          type: string
          minLength: 1
          maxLength: 64
          description: A code from `GET /languages` (case-insensitive) or a language name. For `index-nailong-9b`, a code that completes a supported direction.
          examples: [en, zh, 斯瓦希里语]
        source_lang:
          type: string
          maxLength: 64
          default: auto
          description: |
            A language code or name. `auto` (or omitting the field) lets the model detect the
            language. Required by `index-nailong-9b`, which has no detection.
        glossary:
          type: object
          additionalProperties:
            type: string
          description: Required term translations, source term to target term. Enforced as a hard constraint. Not accepted by `index-nailong-9b`.
          examples:
            - 碳纤维: carbon fiber
        hard_constraints:
          type: array
          items:
            type: string
          description: |
            Requirements that must hold, such as preserving JSON structure, placeholders or
            code. The model was trained on Chinese instructions; write them in Chinese for
            best adherence. Not accepted by `index-nailong-9b`.
          examples:
            - [保留源文中的 JSON 格式标记不变]
        soft_constraints:
          type: array
          items:
            type: string
          description: Graded requirements such as tone, register or domain context. Not accepted by `index-nailong-9b`.
          examples:
            - [调整为严谨、正式、礼貌的商务公文风格]
        genre:
          type: string
          maxLength: 64
          default: 文本
          description: |
            Genre or domain of the source, such as `专栏文章`, `学术论文`, `小说` or `字幕`.
            Only used when a glossary or constraint is present. Not accepted by `index-nailong-9b`.
        max_output_tokens:
          type: integer
          minimum: 1
          description: |
            Cap on generated tokens. Defaults to four times the prompt size plus 512, which
            stops a translation that has gone into a loop. Both the default and an explicit
            value are clamped to the context space left after the prompt.
        stream:
          type: boolean
          default: false
          description: Respond with Server-Sent Events.
    TranslateResponse:
      type: object
      required: [translation, finish_reason, model, usage, timings]
      properties:
        translation:
          type: string
        finish_reason:
          $ref: "#/components/schemas/FinishReason"
        model:
          type: string
          examples: [index-translate-9b]
        usage:
          $ref: "#/components/schemas/Usage"
        timings:
          $ref: "#/components/schemas/Timings"
    TokenizeResponse:
      type: object
      required: [model, counted_with, prompt_tokens, fits, max_output_tokens, limits]
      properties:
        model:
          type: string
          description: The model the prompt is built for (the requested one).
        counted_with:
          type: string
          description: The loaded model whose tokenizer counted the prompt. Equals `model` when that one is loaded.
        prompt_tokens:
          type: integer
          description: Tokens the full prompt occupies, including the instruction and chat template.
        fits:
          type: boolean
          description: Whether `prompt_tokens` is within `limits.max_input_tokens`.
        max_output_tokens:
          type: integer
          description: Context space left for the translation.
        limits:
          $ref: "#/components/schemas/Limits"
    ModelList:
      type: object
      required: [default, loaded, models]
      properties:
        default:
          type: string
          description: The model used when a request names none.
        loaded:
          type: [string, "null"]
          description: The model whose engine is running now, or null before the first load.
        models:
          type: array
          items:
            $ref: "#/components/schemas/ModelInfo"
    ModelInfo:
      type: object
      required: [id, label, kind]
      properties:
        id:
          type: string
          enum: [index-translate-9b, index-nailong-9b]
        label:
          type: string
        kind:
          type: string
          enum: [chat, document]
          description: |
            `chat` translates free text with optional glossary and constraints. `document`
            translates a whole text with a fixed prompt and takes no options beyond the language
            pair and output budget.
        directions:
          type: array
          items:
            type: string
            examples: [zh-en]
          description: Accepted `<source>-<target>` codes, for document models only.
    FinishReason:
      type: string
      enum: [stop, length]
      description: |
        `stop`: the model ended the translation itself. `length`: the output budget ran out
        and the translation is truncated.
    Usage:
      type: object
      required: [prompt_tokens, completion_tokens]
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
    Timings:
      type: object
      required: [queue_ms, prompt_ms, generation_ms, tokens_per_second]
      properties:
        queue_ms:
          type: integer
          description: Time spent waiting for the engine, including any model switch.
        prompt_ms:
          type: integer
          description: Time the engine spent reading the prompt.
        generation_ms:
          type: integer
          description: Time the engine spent generating the translation.
        tokens_per_second:
          type: number
          description: Generation speed.
    Limits:
      type: object
      required: [context_tokens, max_input_tokens]
      properties:
        context_tokens:
          type: integer
          description: Context window shared by the prompt and the translation.
          examples: [65536]
        max_input_tokens:
          type: integer
          description: Largest accepted prompt.
          examples: [28000]
    Language:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          examples: [zh]
        name:
          type: string
          description: English name of the language.
          examples: [Chinese]
    Health:
      type: object
      required: [status, model, limits, queue]
      properties:
        status:
          type: string
          enum: [loading, ready, error, stopped]
        error:
          type: string
          description: Present when `status` is `error`.
        model:
          type: [string, "null"]
          description: The loaded model, or null when none is loaded.
        limits:
          $ref: "#/components/schemas/Limits"
        queue:
          type: object
          required: [running, waiting, max_waiting]
          properties:
            running:
              type: boolean
              description: Whether a translation is in progress.
            waiting:
              type: integer
            max_waiting:
              type: integer
        speech:
          type: object
          description: The speech engine. It does not affect `status` or the HTTP status of this endpoint.
          required: [status]
          properties:
            status:
              $ref: "#/components/schemas/SpeechStatus"
            error:
              type: string
              description: Why speech is `unavailable`, or why the model could not be loaded last time.
    SpeechStatus:
      type: string
      enum: [unavailable, stopped, starting, ready, error]
      description: |
        `unavailable`: turned off, or the engine or its model is not installed. `stopped`:
        installed, the model is not loaded; a `POST /speech` loads it (`starting`, then `ready`)
        and it is unloaded again when idle. `error`: the last load failed; the next request tries
        again.
    SpeechRequest:
      type: object
      required: [text, lang]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1000
          description: The text to speak, at most 1,000 characters. Must contain a non-blank character.
        lang:
          type: string
          enum: [zh, en, ja, es, ar]
          description: Language of the text.
        voice:
          type: string
          description: A voice id from `GET /voices`. Default is the first voice listed.
        speed:
          type: number
          minimum: 0.5
          maximum: 2
          default: 1
          description: |
            Speaking rate; 2 is twice as fast. This is the model's duration control (the audio
            lasts 1/speed as long), not faster playback.
    Voice:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: File name of the reference recording in the voices directory, without `.wav`.
        name:
          type: string
    VoiceList:
      type: object
      required: [status, languages, speed, max_chars, voices]
      properties:
        status:
          $ref: "#/components/schemas/SpeechStatus"
        error:
          type: string
        languages:
          type: array
          items:
            type: string
        speed:
          type: object
          required: [min, max]
          properties:
            min:
              type: number
            max:
              type: number
        max_chars:
          type: integer
          description: Longest `text` of one `POST /speech`.
        max_sample_bytes:
          type: integer
          description: Largest body of `POST /voices`.
        sample_seconds:
          type: object
          description: Duration a `POST /voices` recording must have, in seconds.
          required: [min, max]
          properties:
            min:
              type: number
            max:
              type: number
        sample_rate:
          type: object
          description: Sample rate a `POST /voices` recording must have, in Hz.
          required: [min, max]
          properties:
            min:
              type: integer
            max:
              type: integer
        voices:
          type: array
          description: Empty when speech is unavailable or the voices directory holds no WAV file.
          items:
            $ref: "#/components/schemas/Voice"
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - unsupported_language_pair
                - input_too_long
                - body_too_large
                - queue_full
                - engine_error
                - engine_unavailable
                - speech_error
                - speech_unavailable
                - not_found
                - method_not_allowed
                - unsupported_media_type
                - forbidden_origin
                - forbidden_host
                - internal_error
                - cancelled
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    QueuedEvent:
      type: object
      required: [position]
      properties:
        position:
          type: integer
          minimum: 1
          description: Number of translations ahead of this one, including the running one.
    StartEvent:
      type: object
      required: [model, prompt_tokens, max_output_tokens, queue_ms]
      properties:
        model:
          type: string
          description: The model that will translate this request.
        prompt_tokens:
          type: integer
        max_output_tokens:
          type: integer
          description: Output budget in effect for this translation.
        queue_ms:
          type: integer
    DeltaEvent:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: The next piece of the translation.
    DoneEvent:
      type: object
      required: [finish_reason, usage, timings]
      properties:
        finish_reason:
          $ref: "#/components/schemas/FinishReason"
        usage:
          $ref: "#/components/schemas/Usage"
        timings:
          $ref: "#/components/schemas/Timings"
    ErrorEvent:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [input_too_long, engine_error, internal_error]
          description: |
            `input_too_long` carries the same `details` as the JSON `413`. `engine_error` covers
            both failed generations and failed model loads.
        message:
          type: string
        details:
          type: object
          additionalProperties: true
