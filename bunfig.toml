[test]
# Playwright specs under e2e/ run with `bun run e2e`, not `bun test`.
root = "test"
onlyFailures = true
# `bun test --coverage` (`bun run test:coverage`) reports the application code, not the tests or their mocks.
coverageSkipTestFiles = true
coveragePathIgnorePatterns = ["test/**", "e2e/**", "public/vendor/**"]

[test.reporter]
dots = true

[lint]
ignorePatterns = ["src/api-schema.d.ts", "vendor/", "models/", "dist/", "playwright-report/", "test-results/"]
maxWarnings = 0
typeAware = true
typeCheck = true

[lint.categories]
correctness = "error"

