[test]
# Playwright specs under e2e/ run with `bun run e2e`, not `bun test`.
root = "test"
onlyFailures = true
# `bun test --coverage` (`bun run test:coverage`) reports the application code, not the tests or their mocks.
coverageSkipTestFiles = true
coveragePathIgnorePatterns = ["test/**", "e2e/**", "public/vendor/**"]

[test.reporter]
dots = true

[lint]
ignorePatterns = ["vendor/", "models/", "dist/", "playwright-report/", "test-results/"]
maxWarnings = 0
typeAware = true
typeCheck = true

[lint.categories]
correctness = "error"

[lint.rules]
# Off on purpose: the app and its tests handle untyped JSON from the wire (HTTP responses, SSE events,
# the mock engine). test/api-contract.test.ts checks those bodies against docs/openapi.yaml instead.
"@typescript-eslint/no-explicit-any" = "off"
"@typescript-eslint/no-unsafe-member-access" = "off"
"@typescript-eslint/no-unsafe-assignment" = "off"
"@typescript-eslint/no-unsafe-call" = "off"
"@typescript-eslint/no-unsafe-return" = "off"
"@typescript-eslint/no-unsafe-argument" = "off"
# Off: Bun types `expect(...).rejects.toX()` as void, but the tests await it as documented, and the
# rule would have them drop the await.
"@typescript-eslint/await-thenable" = "off"
"no-empty" = ["warn", { allowEmptyCatch = true }]
"@typescript-eslint/no-unused-vars" = [
  "warn",
  { argsIgnorePattern = "^_", varsIgnorePattern = "^_", caughtErrorsIgnorePattern = "^_" },
]
"@typescript-eslint/ban-ts-comment" = ["warn", { ts-expect-error = false }]
# Off: used patterns
"import/default" = "off"
"no-control-regex" = "off"
"@next/next/no-assign-module-variable" = "off"

# ts:recommended(-type-check), ts:strict(-type-check), ts:stylistic(-type-check)
"@typescript-eslint/no-confusing-non-null-assertion" = "warn"
"@typescript-eslint/no-extraneous-class" = "warn"
"@typescript-eslint/no-generated-empty-object-type" = "warn"
"@typescript-eslint/no-unnecessary-boolean-literal-compare" = "warn"
"@typescript-eslint/no-unnecessary-template-expression" = "warn"
"@typescript-eslint/no-unnecessary-type-arguments" = "warn"
"@typescript-eslint/no-unnecessary-type-assertion" = "warn"
"@typescript-eslint/no-unnecessary-type-constraint" = "warn"
"@typescript-eslint/no-unnecessary-type-conversion" = "warn"
"@typescript-eslint/no-unsafe-enum-comparison" = "warn"
"@typescript-eslint/no-deprecated" = "warn"
"@typescript-eslint/no-misused-promises" = "warn"
"@typescript-eslint/no-mixed-enums" = "warn"
