[package]
name = "minisilk-wasm"
version = "0.1.0"
edition = "2024"
publish = false
description = "wasm32-unknown-unknown cdylib exposing the minisilk encoder"

[lib]
crate-type = ["cdylib"]

[features]
# Adds the `minisilk_stack_peak` export (see minisilk/PORTING.md, "Pseudostack size").
stack-peak = ["minisilk/stack-peak"]

[dependencies]
minisilk = { path = ".." }
